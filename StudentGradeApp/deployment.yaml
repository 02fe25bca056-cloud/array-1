apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-grade-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-grade
  template:
    metadata:
      labels:
        app: student-grade
    spec:
      containers:
        - name: student-grade-container
          image: student-grade-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

